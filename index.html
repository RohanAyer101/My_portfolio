<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arin Sunam</title>
    <script
      src="https://kit.fontawesome.com/45d6f44126.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- === HEADER === -->
    <header class="navbar">
      <nav class="nav-container">
        <a href="" class="logo">Arin Meow</a>

        <div class="navlinks">
          <a href="" class="navlink">Curriculum</a>
          <a href="" class="navlink">Projects </a>

        </div>

        <button class="nav-button">Ping me</button>
      </nav>
    </header>

    <!-- === BODY === -->
    <main>
      <!-- === HERO SECTION === -->
      <section class="hero">
        <div class="hero-container">
          <!-- hero left -->
          <div class="hero-left">
            <p class="eyebrow">Namaste, I'm</p>

            <h1 class="hero-name">Arin Meow</h1>

            <p class="hero-desc">
              Aspiring fullstak developer focused on optimization scaling and
              great user experience
            </p>

            <ul class="skills">
              <li class="skill">Html</li>
              <li class="skill">Css</li>
              <li class="skill">JavaScript</li>
            </ul>

            <div>
              <button>
                View My Work
                <i class="fa-solid fa-arrow-down"></i>
              </button>

              <button>Get In Touch</button>
            </div>
          </div>

          <!-- hero-right -->
          <div class="hero-right">
            <div class="portrait-container">
              <img
                src="https://plus.unsplash.com/premium_photo-1671656349322-41de944d259b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Arin Photo"
                class="potrait-img"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- === PROJECT SECTION === -->
      <section class="project"></section>
      <!-- === ABOUT SECTION === -->
      <section class="about"></section>
      <!-- === CONTACT SECTION === -->
      <section class="contact"></section>
    </main>
